name: Cashbox KTV Weekly Scrape

on:
  workflow_dispatch: {}
  schedule:
    # GitHub Actions cron 使用 UTC
    # 下面這行是「每週一 01:30 Asia/Taipei」≈「週日 17:30 UTC」
    - cron: "30 17 * * 0"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Prepare debug dir
        run: |
          mkdir -p debug
          echo "" > debug/.keep

      - name: Run scraper
        run: |
          npm run scrape

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git commit -m "Add weekly Cashbox KTV CSV" || echo "No changes to commit"
          git push

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
